
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Logs | Diabetes In Space</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 15px;
}

.banner {
    width: 100%;
    display: block;
}

input {
    padding: 8px;
    margin: 5px 0 15px;
    width: 250px;
    max-width: 90%;
}

button {
    background: #001b5e;
    color: white;
    border: none;
    padding: 9px 16px;
    cursor: pointer;
}

#entries {
    margin-top: 10px;
}

.entry {
    border-bottom: 1px solid #ddd;
    padding: 5px 0;
}
</style>
</head>

<body>

<img class="banner" src="food1images/logs.jpg" alt="Logs">

<h1>Logs</h1>

<h3>Blood glucose (mmol/L) </h3>
<input type="number" id="glucose" step="0.1" placeholder="Enter reading">

<h3>What are you doing right now?(eg exersizing or eating)</h3>
<input type="text" id="activity" placeholder="...">

<br>
<button onclick="addLog()">Log Entry</button>

<h2>Previous Entries</h2>

<div id="entries">no entrys create one to fill up</div>

<p><a href="index.html">Back to Home</a></p>

<script>

let logs = [];

function addLog() {

    let glucose = document.getElementById("glucose").value;
    let activity = document.getElementById("activity").value;

    if (glucose === "" && activity.trim() === "") {
        return;
    }

    let now = new Date();

    logs.unshift({
        glucose: glucose,
        activity: activity,
        date: now.toLocaleDateString() + " " +
              now.toLocaleTimeString([], {
                  hour: "2-digit",
                  minute: "2-digit"
              })
    });

    showLogs();

    document.getElementById("glucose").value = "";
    document.getElementById("activity").value = "";
}

function showLogs() {

    let entries = document.getElementById("entries");
    entries.innerHTML = "";

    if (logs.length === 0) {
        entries.textContent = "No entries yet.";
        return;
    }

    logs.forEach(log => {

        let entry = document.createElement("div");
        entry.className = "entry";

        entry.textContent =
            log.date + " | " +
            (log.glucose ? log.glucose + " mmol/L" : "") +
            " | " + log.activity;

        entries.appendChild(entry);

    });
}

</script>

</body>
</html>
