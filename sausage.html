
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sausages</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: white;
    font-family: Arial, sans-serif;
    color: black;
}

h1 {
    color: darkblue;
    text-decoration: underline;
    font-size: 30px;
}

h2 {
    font-size: 21px;
    margin-top: 30px;
}

table {
    width: 100%;
    max-width: 700px;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    border: 1px solid #ccc;
    padding: 12px;
    text-align: left;
}

th {
    background: #e8edf3;
}

input[type="range"] {
    width: 110px;
}

.amount {
    display: inline-block;
    min-width: 35px;
}

.total {
    margin-top: 25px;
    font-size: 19px;
    font-weight: bold;
}

button {
    padding: 12px 25px;
    border: none;
    cursor: pointer;
    font-size: 16px;
    margin-top: 25px;
}

.cancel {
    background: #ddd;
    color: black;
}

.save {
    background: #001b5e;
    color: white;
    margin-left: 10px;
    border-radius: 30px;
    text-shadow:
        0 0 3px white,
        0 0 6px white,
        0 0 12px white,
        0 0 18px white;
}

@media(max-width: 500px) {
    body {
        padding: 12px;
    }

    th, td {
        padding: 8px 5px;
        font-size: 13px;
    }

    input[type="range"] {
        width: 75px;
    }
}
</style>
</head>

<body>

<h1>Sausages</h1>

<h2>Sausages</h2>

<p>Choose how many sausages you want.</p>

<table>
<tr>
    <th>Food</th>
    <th>Amount</th>
    <th>Carbs</th>
</tr>

<tr>
    <td>Sausages</td>
    <td>
        <input type="range" id="sausages" min="0" max="6" step="1" value="2">
        <span class="amount" id="sausageAmount">2 sausages</span>
    </td>
    <td id="sausageCarbs">1.5g</td>
</tr>
</table>

<div class="total">
Total carbohydrates: <span id="total">1.5g</span>
</div>

<button class="cancel" onclick="location.href='fooddictionary.html'">
Cancel
</button>

<button class="save" onclick="saveMeal()">
Add to Meal
</button>

<script>
const carbsPerSausage = 0.75;

const sausageSlider = document.getElementById("sausages");

function calculate() {
    const amount = Number(sausageSlider.value);
    const carbs = amount * carbsPerSausage;

    document.getElementById("sausageAmount").textContent =
        amount + (amount === 1 ? " sausage" : " sausages");

    document.getElementById("sausageCarbs").textContent =
        carbs.toFixed(1) + "g";

    document.getElementById("total").textContent =
        carbs.toFixed(1) + "g";
}

sausageSlider.addEventListener("input", calculate);

function saveMeal() {
    let meal = [];

    try {
        meal = JSON.parse(localStorage.getItem("spaceMeal")) || [];
        if (!Array.isArray(meal)) meal = [];
    } catch {
        meal = [];
    }

    const amount = Number(sausageSlider.value);
    const carbs = amount * carbsPerSausage;

    meal.push({
        food: "Sausages",
        amount: amount,
        carbsPerSausage: carbsPerSausage,
        totalCarbs: Number(carbs.toFixed(1))
    });

    localStorage.setItem("spaceMeal", JSON.stringify(meal));

    location.href = "fooddictionary.html";
}

calculate();
</script>

</body>
</html>
