
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Food Dictionary | Diabetes In Space</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: white;
    font-family: Arial, sans-serif;
}

.banner {
    width: 100%;
}

.banner img {
    display: block;
    width: 100%;
    height: auto;
}

.content {
    padding: 35px 5%;
}

h1 {
    font-size: 26px;
    color: #333;
    margin-bottom: 20px;
}

.food-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 40px;
}

.food {
    width: 160px;
    height: 160px;
    display: block;
    overflow: hidden;
    border-radius: 8px;
}

.food img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.food:hover {
    transform: scale(1.04);
}

@media (max-width: 600px) {
    .food-row {
        gap: 12px;
    }

    .food {
        width: calc(33.333% - 8px);
        height: auto;
        aspect-ratio: 1 / 1;
    }
}
</style>
</head>

<body>

<div class="banner">
    <img src="food1images/Diabetes In space (1).png" alt="Diabetes In Space">
</div>

<div class="content">

    <h1>Breakfast</h1>

    <div class="food-row">

        <a href="cereal.html" class="food">
            <img src="images/breakfast/cereal.png" alt="Cereal">
        </a>

        <a href="egg.html" class="food">
            <img src="images/breakfast/egg.png" alt="Scrambled eggs">
        </a>

        <a href="sausage.html" class="food">
            <img src="images/breakfast/sausage.png" alt="Sausage">
        </a>

    </div>

    <h1>Lunch / Dinner</h1>

    <div class="food-row">

        <a href="MacCheese.html" class="food">
            <img src="images/lunch/MacCheese.png" alt="Macaroni and cheese">
        </a>

        <a href="tortilla.html" class="food">
            <img src="images/lunch/tortilla.png" alt="Tortilla">
        </a>

    </div>

</div>

</body>
</html>
